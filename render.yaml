services:
  - type: web
    name: wenits-api
    runtime: node
    rootDir: services/api
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENC_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: X_LOGIN_REQUIRED
        value: "false"
      - key: PRICE_STALE_MS
        value: "15000"
      - key: MH_BASE_URL
        value: "https://multihopper.com"
      - key: MH_API_KEY
        sync: false
      - key: MH_WEBHOOK_SECRET
        sync: false
      - key: PAYOUT_TREASURY_WALLET
        sync: false
      - key: PAYOUT_ADMIN_TOKEN
        generateValue: true
  - type: worker
    name: wenits-price-writer
    runtime: node
    rootDir: services/api
    buildCommand: npm install
    startCommand: node src/jobs/price-writer.js
    envVars:
      - key: REDIS_URL
        sync: false
      - key: PRICE_WRITE_INTERVAL_MS
        value: "60000"
databases:
  - name: wenits-db
    plan: free
# Redis: buat manual di dashboard (New -> Key Value, free) lalu isi REDIS_URL di kedua service.
# (Blueprint 'databases' hanya support Postgres.)
